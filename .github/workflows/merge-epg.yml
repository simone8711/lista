name: Merge EPG
on:
  schedule: [{ cron: "23 3 * * *" }]
  workflow_dispatch:
permissions: { contents: write }
jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python merge_epg.py
      - name: Commit amend
        run: |
          git config user.name "epg-bot"
          git config user.email "bot@users.noreply.github.com"
          git add epg.xml.gz channels.txt
          if git diff --cached --quiet; then
            echo "nessuna modifica, skip commit"
          elif git log -1 --pretty=%B 2>/dev/null | grep -q "epg: merge"; then
            git commit --amend --no-edit --no-verify
            git push --force-with-lease
          else
            git commit --no-verify -m "epg: merge giornaliero epg.lat + epgshare01 + ch + zappr"
            git push
          fi
